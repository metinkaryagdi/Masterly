server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index Auth.html;

    # JSX files are served as text/babel scripts in this prototype; nginx
    # would otherwise return them as application/octet-stream.
    types {
        text/babel jsx;
        text/html  html;
    }
    default_type application/octet-stream;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin reverse proxy to the api container: the frontend's default
    # apiBase is "" (relative), so this makes the shipped compose stack work
    # without any per-browser Tweaks configuration and without needing CORS
    # for the browser<->web hop at all.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Kaynaklar sürümlenmediği için tarayıcının sezgisel önbelleği eski
        # jsx dosyalarını gösterebiliyor; her istekte ETag ile doğrulat.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /Auth.html;
    }
}
